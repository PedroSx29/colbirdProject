<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="{% static 'js/bootstrap.bundle.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>Colbird</title>
</head>
<body style="background-color: rgb(191, 209, 224);">
    <nav class="navbar navbar-expand-ms" style="background-color: #e3f2fd;" data-bs-theme="light">
        <div class="container-fluid">
            <h1 class="m-2" style="color: gray;">Colbird</h1>
        </div>
    </nav>
    
    {% block Identificador %}
    <div class="container mt-4 text-center">
        <button id="btnGrabar" class="btn btn-outline-light fw-medium rounded-circle p-5"  style="background-color: #e3f2fd; color: gray;">
            <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="currentColor" class="bi bi-mic" viewBox="0 0 16 16">
                <path d="M3.5 6.5A.5.5 0 0 1 4 7v1a4 4 0 0 0 8 0V7a.5.5 0 0 1 1 0v1a5 5 0 0 1-4.5 4.975V15h3a.5.5 0 0 1 0 1h-7a.5.5 0 0 1 0-1h3v-2.025A5 5 0 0 1 3 8V7a.5.5 0 0 1 .5-.5"/>
                <path d="M10 8a2 2 0 1 1-4 0V3a2 2 0 1 1 4 0zM8 0a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V3a3 3 0 0 0-3-3"/>
            </svg>
        </button>
        <div id="aves" class="text-center mt-2 d-none">
            <button class="btn btn-outline-light fw-medium ms-2" style="background-color: #e3f2fd; color: gray;" 
            data-bs-toggle="modal" 
            data-bs-target="#modalAve" 
            data-url="{% url 'obtenerLoica' %}">Loica</button>
            <button class="btn btn-outline-light fw-medium ms-2" style="background-color: #e3f2fd; color: gray;" 
            data-bs-toggle="modal" 
            data-bs-target="#modalAve" 
            data-url="{% url 'obtenerCarpintero' %}">Carpintero Negro</button>
            <button class="btn btn-outline-light fw-medium ms-2" style="background-color: #e3f2fd; color: gray;" 
            data-bs-toggle="modal" 
            data-bs-target="#modalAve" 
            data-url="{% url 'obtenerTiuque' %}">Tiuque</button>
            <div id="btnInt" class="text-center mt-2">
                <button id="btnCancel" class="btn btn-danger fw-medium">Cancelar</button>
            </div>
        </div>
    </div>
    
    <div class="modal fade" id="modalAve" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-md"> 
            <div class="modal-content" id="contenedor-renderizado">
            </div>
        </div>
    </div>
    {% endblock Identificador %}
    
    {% block dashboard %}
    <div class="container mt-5 mb-5">
        <div class="card shadow-sm border-0" style="background-color: #e3f2fd;">
            <div class="card-body p-4 text-center">
                <h4 style="color: gray;" class="mb-4">Flujo de Búsquedas de Aves</h4>
                
                <div class="btn-group mb-4" role="group">
                    <button type="button" class="btn btn-outline-secondary" onclick="actualizarGrafico('semanal')">Semanal</button>
                    <button type="button" class="btn btn-outline-secondary" onclick="actualizarGrafico('mensual')">Mensual</button>
                    <button type="button" class="btn btn-outline-secondary" onclick="actualizarGrafico('semestral')">Semestral</button>
                    <button type="button" class="btn btn-outline-secondary" onclick="actualizarGrafico('anual')">Anual</button>
                </div>

                <div style="max-width: 600px; margin: 0 auto; background-color: white; padding: 20px; border-radius: 10px;">
                    <canvas id="graficoAves"></canvas>
                </div>
            </div>
        </div>
    </div>
    {% endblock dashboard %}
    
    <script>
        const btnGrabar = document.getElementById('btnGrabar')
        const btnCancelar = document.getElementById('btnCancel')
        const contenedorAves = document.getElementById('aves')
        
        btnGrabar.addEventListener('click', function() {
            btnGrabar.classList.add('d-none')
            contenedorAves.classList.remove('d-none')
        })
        
        btnCancelar.addEventListener('click', function() {
            btnGrabar.classList.remove('d-none')
            contenedorAves.classList.add('d-none')
        })
    
        const modalAve = document.getElementById('modalAve')
        
        modalAve.addEventListener('show.bs.modal', function (event) {
            const boton = event.relatedTarget
            const urlDjango = boton.getAttribute('data-url')
            const contenedor = document.getElementById('contenedor-renderizado')
            
            fetch(urlDjango)
                .then(response => {
                    if (!response.ok) throw new Error('Error HTTP status: ' + response.status)
                    return response.text()
                })
                .then(html => {
                    contenedor.innerHTML = html;
                    actualizarGrafico('semanal');
                })
                .catch(error => {
                    contenedor.innerHTML = `
                        <div class="modal-body text-center p-4 text-danger">
                            <p class="mb-0">No se pudo cargar la información del ave.</p>
                        </div>
                    `
                    console.error("Detalle del fallo:", error)
                })
        })

        let miGrafico;

        function actualizarGrafico(filtro) {
            fetch(`{% url 'datos_dashboard' %}?filtro=${filtro}`)
                .then(response => response.json())
                .then(data => {
                    const ctx = document.getElementById('graficoAves').getContext('2d');
                    
                    if (miGrafico) {
                        miGrafico.destroy();
                    }
                    
                    miGrafico = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: data.labels,
                            datasets: [{
                                label: `Cantidad de Búsquedas (${filtro.toUpperCase()})`,
                                data: data.data,
                                backgroundColor: [
                                    'rgba(54, 162, 235, 0.5)',
                                    'rgba(255, 99, 132, 0.5)',
                                    'rgba(255, 206, 86, 0.5)'
                                ],
                                borderColor: [
                                    'rgba(54, 162, 235, 1)',
                                    'rgba(255, 99, 132, 1)',
                                    'rgba(255, 206, 86, 1)'
                                ],
                                borderWidth: 1
                            }]
                        },
                        options: {
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    ticks: {
                                        stepSize: 1
                                    }
                                }
                            }
                        }
                    });
                })
                .catch(error => console.error("Error al cargar datos del dashboard:", error));
        }

        document.addEventListener('DOMContentLoaded', function() {
            actualizarGrafico('semanal');
        });
    </script>
</body>
</html>
